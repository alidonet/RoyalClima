<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <style>
    .rotor { transform-origin: 20px 20px; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rotor { animation: none; } }
  </style>
  <g class="rotor" fill="#42483b">
    <path id="blade" d="M20 18C12 16 9 8 15 5C22 1 29 8 23 18Z"/>
    <use href="#blade" transform="rotate(120 20 20)"/>
    <use href="#blade" transform="rotate(240 20 20)"/>
    <circle cx="20" cy="20" r="4"/>
  </g>
</svg>
