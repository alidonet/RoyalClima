  <path class="blade" style="animation-delay:-1s" transform="rotate(120 20 20)" d="M18.8 14.5C17.1 11.8 16.1 6.8 18 4.9C19.2 3.7 22.2 3.6 23.9 4.7C24.8 5.3 24.6 6.4 23.7 8L21.2 14.5Z"/>
  <path class="blade" style="animation-delay:-0.75s" transform="rotate(180 20 20)" d="M18.8 14.5C17.1 11.8 16.1 6.8 18 4.9C19.2 3.7 22.2 3.6 23.9 4.7C24.8 5.3 24.6 6.4 23.7 8L21.2 14.5Z"/>
  <path class="blade" style="animation-delay:-0.5s" transform="rotate(240 20 20)" d="M18.8 14.5C17.1 11.8 16.1 6.8 18 4.9C19.2 3.7 22.2 3.6 23.9 4.7C24.8 5.3 24.6 6.4 23.7 8L21.2 14.5Z"/>
  <path class="blade" style="animation-delay:-0.25s" transform="rotate(300 20 20)" d="M18.8 14.5C17.1 11.8 16.1 6.8 18 4.9C19.2 3.7 22.2 3.6 23.9 4.7C24.8 5.3 24.6 6.4 23.7 8L21.2 14.5Z"/>
  <circle cx="20" cy="20" r="3.2" fill="#42483b"/>
</svg>
