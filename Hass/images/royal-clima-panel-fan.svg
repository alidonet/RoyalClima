<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <style>
    .blade { fill: #42483b; animation: lcd-off 1.5s steps(1, end) infinite; }
    @keyframes lcd-off {
      0% { opacity: .4; }
      16.666667%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blade { animation: none; opacity: 1; }
    }
  </style>
  <!-- Six narrow fixed LCD blades; one fades clockwise every 250 ms. -->
  <path class="blade" style="animation-delay:0s" transform="rotate(0 20 20)" d="M18.8 14.5C17.1 11.8 16.1 6.8 18 4.9C19.2 3.7 22.2 3.6 23.9 4.7C24.8 5.3 24.6 6.4 23.7 8L21.2 14.5Z"/>
