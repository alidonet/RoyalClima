substitutions:
  name: royalclima
  tx_pin: GPIO17
  rx_pin: GPIO16
  en_pin: GPIO18
  baud_rate: "9600"  # SW4-4: ON = 9600, OFF = 4800.
  modbus_address: "1"  # Controller parameter 08.
  refresh_interval: 10s

globals:
  - id: global_vent_online
    type: bool
    initial_value: "false"
  
esphome:
  name: ${name}
  friendly_name: Royal Clima
  comment: "Read-only Modbus diagnostics for Royal Clima RCS-650-P"
  project:
    name: "alidonet.royalclima"
    version: 0.1.261107
  devices:
    - id: device_vent
      name: "Ventilation System"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # advanced:
    #   minimum_chip_revision: "3.1"

wifi:
  # Optional override for OTA/log access; does not configure the device IP.
  # use_address: royalclima.local
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      #manual_ip:
      #  static_ip: !secret esp_rc_ip_address
      #  gateway: !secret esp_ip_gateway
      #  subnet: 255.255.255.0
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
      manual_ip:
        static_ip: !secret esp_rc_ip_address2
        gateway: !secret esp_ip_gateway2
        subnet: 255.255.255.0
  ap:
    # ap_timeout: 30s

captive_portal:

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
#mqtt:
#  broker: !secret mqtt_ip_address
#  username: !secret mqtt_user
#  password: !secret mqtt_password
#  id: !secret esp_mqtt_topic

api:

ota:
  - platform: esphome

logger:
  level: DEBUG

web_server:
  local: true
  port: 80

light:
  - platform: status_led
    name: "ESP32 LED"
    id: led_output
    # device_id: device_esp
    pin: GPIO2

uart:
  id: royalclima_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  # Assumes EN connects DE and /RE: high = transmit, low = receive.
  flow_control_pin: ${en_pin}
  baud_rate: ${baud_rate}
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: royalclima_modbus
  uart_id: royalclima_uart
  send_wait_time: 2s
  turnaround_time: 1s

modbus_controller:
  - id: royalclima_controller
    modbus_id: royalclima_modbus
    address: ${modbus_address}
    update_interval: ${refresh_interval}
    max_cmd_retries: 1
    offline_skip_updates: 2
    on_online: 
      then:
        - globals.set: 
            id: global_vent_online
            value: "true"        
        - logger.log:
            format: "Vent system connected"
            level: info
    on_offline: 
      then:
        - globals.set: 
            id: global_vent_online
            value: "false"
        - logger.log:
            format: "Vent system NOT connected"
            level: info

#time:
#  - platform: sntp

# Only holding-register reads (FC03); no writes or startup commands.
# Registers 9-15 form one contiguous read; 18 and 20 are separate reads.
# timeout marks stale measurements unknown if valid replies stop arriving.
sensor:
  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Power state raw"
    address: 9
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - timeout: 40s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - globals.set:
                  id: global_vent_online
                  value: "true"
              - light.turn_on: led_output
              - delay: 150ms
              - light.turn_off: led_output
            else:
              - globals.set:
                  id: global_vent_online
                  value: "false"

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Supply fan speed code"
    address: 10
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    # Speed 0-10 maps to 0, 2, 3, 5, 8, 9, 10, 11, 12, 13, 14.
    device_id: device_vent
    filters:
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Exhaust fan speed code"
    address: 11
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Return air temperature"
    address: 12
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Outdoor air temperature"
    address: 13
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    # Manuals disagree on SA/EA: compare with the wall controller first.
    name: "Temperature register 14"
    address: 14
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Defrost temperature"
    address: 15
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    device_id: device_vent
    filters:
      - offset: -40
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Status flags raw"
    address: 18
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    # Bits: 0 fire alarm, 1 bypass open, 2 bypass closed, 3 defrost.
    device_id: device_vent
    filters:
      - timeout: 40s

  - platform: modbus_controller
    modbus_controller_id: royalclima_controller
    name: "Error flags raw"
    address: 20
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    # Error bit meanings differ between protocol revisions.
    device_id: device_vent
    filters:
      - timeout: 40s

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "ESP32 connection"
    entity_category: diagnostic

  - platform: template
    name: "Vent system Online"
    device_id: device_vent
    device_class: connectivity
    lambda: !lambda |-
      return (id(global_vent_online));
    entity_category: "diagnostic"   
